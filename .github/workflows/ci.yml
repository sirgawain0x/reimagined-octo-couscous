name: Bit Rewards release checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --run
      - run: npm run build
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: node e2e/storefront.mjs

  rewards-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rewards-pilot/package-lock.json
      - run: npm ci --prefix tests/rewards-pilot
      - run: npm test --prefix tests/rewards-pilot
